name: Build EasyEject

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Find solution
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.sln |
            Select-Object -ExpandProperty FullName

      - name: Build solution
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Recurse -Filter *.sln |
            Select-Object -First 1

          if (!$solution) {
            throw "No solution file found"
          }

          msbuild $solution.FullName `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: EasyEject-Build
          path: |
            **/bin/Release/x64/
          if-no-files-found: warn
