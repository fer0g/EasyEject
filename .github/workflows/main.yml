name: EasyEject x64 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish x64
        shell: pwsh
        run: |
          dotnet publish ./src/EasyEject.UI/EasyEject.UI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:Platform=x64 `
            -o ./publish

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* `
            -DestinationPath ./EasyEject-x64.zip

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyEject-x64
          path: EasyEject-x64.zip
          compression-level: 9
          retention-days: 14
